name: Wheels

# pet-kokkos's wheels: on a tag, by hand, or on a pull request that touches
# the packaging.
# - CPU (pyproject.toml's [tool.cibuildwheel]): Linux x86_64 and aarch64
#   (OpenMP, OpenBLAS), macOS arm64 (threads, Accelerate), and the sdist: to
#   PyPI on a tag, by trusted publishing (the pypi environment).
# - GPU variants (python/wheels/): pet-kokkos 0.1.0+cu12, +cu13 (x86_64,
#   aarch64), +rocm6, +rocm7 (x86_64). PyPI takes no local versions: on a tag
#   they go to the GitHub release, and tools/wheel_index.py publishes an index
#   for each on GitHub Pages (Settings > Pages > Source: GitHub Actions).
#   Built without a GPU; tested on real hardware by hand.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["pyproject.toml", "python/**", "tools/wheel_index.py", ".github/workflows/wheels.yml"]

permissions:
  contents: read

jobs:
  cpu:
    name: cpu ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pypa/cibuildwheel@v3.2
        with:
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-cpu-${{ matrix.os }}
          path: wheelhouse/*.whl

  gpu:
    name: ${{ matrix.variant }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: cu12, os: ubuntu-24.04, cuda: "12-8" }
          - { variant: cu12, os: ubuntu-24.04-arm, cuda: "12-8" }
          - { variant: cu13, os: ubuntu-24.04, cuda: "13-0" }
          - { variant: cu13, os: ubuntu-24.04-arm, cuda: "13-0" }
          - { variant: rocm6, os: ubuntu-24.04, rocm: "6.3.2", archs: "--offload-arch=gfx942" }
          - { variant: rocm7, os: ubuntu-24.04, rocm: "7.0.3", archs: "--offload-arch=gfx942 --offload-arch=gfx950" }
    env:
      PET_KOKKOS_VARIANT: ${{ matrix.variant }}
      PET_CUDA: ${{ matrix.cuda }}
      PET_ROCM: ${{ matrix.rocm }}
      PET_ROCM_ARCHS: ${{ matrix.archs }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The toolkits are large: make room on the runner first.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: pypa/cibuildwheel@v3.2
        with:
          config-file: python/wheels/${{ startsWith(matrix.variant, 'cu') && 'cuda' || 'rocm' }}.toml
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.variant }}-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build --sdist -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # On a tag: every wheel and the sdist to the GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cpu, gpu, sdist]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber dist/*

  # On a tag: the CPU wheels and the sdist to PyPI.
  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cpu, sdist]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/pet-kokkos
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-cpu-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Then the GPU variants' indexes, over every release, to GitHub Pages.
  index:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/wheel_index.py "$GITHUB_REPOSITORY" site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
