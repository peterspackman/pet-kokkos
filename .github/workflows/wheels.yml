name: Wheels

# CPU wheels for PyPI-style installs (pyproject.toml's [tool.cibuildwheel]):
# Linux x86_64 and aarch64 (OpenMP, OpenBLAS), macOS arm64 (threads,
# Accelerate), and the sdist, for GPU builds from source. Artifacts only: no
# publishing yet.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  wheels:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pypa/cibuildwheel@v3.2
        with:
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build --sdist -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
