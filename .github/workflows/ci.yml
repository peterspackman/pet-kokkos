name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # The test models: published checkpoints, converted here. Weights are never
      # committed; the cache keeps them between runs.
      - name: Cache models
        id: models
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('tools/convert_pet.py') }}

      - name: Make models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          uv run tools/convert_pet.py --model pet-mad-xs --version 1.5.0 --out models/pet-mad-xs
          uv run tools/convert_pet.py --model pet-mad-xs --version 1.6.0 --out models/pet-mad-xs-v1.6
          uv run tools/convert_pet.py --model pet-mols-s --version 1.0.0 --out models/pet-mols-s-v1.0
          uv run tools/convert_pet.py --model pet-omol-s --version 1.0.0 --out models/pet-omol-s

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .cpm
          key: cpm-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}

      - name: Configure
        run: cmake --preset serial -D PET_ARCH_NATIVE=OFF

      - name: Build
        run: cmake --build build-serial -j 4

      - name: Test
        run: ctest --preset serial -j 4
