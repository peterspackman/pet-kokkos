# pet-kokkos-cuda12: the compiled core for NVIDIA GPUs, built from the
# repository root (cmake.source-dir) into pet_kokkos_cuda12. One wheel for every
# GPU from compute capability 8.0: Kokkos builds for sm_80 (its one
# architecture), and NVCC_APPEND_FLAGS adds sm_89 and sm_90 code and compute_90
# PTX for later GPUs. The CUDA runtime and cuBLAS come from NVIDIA's pip
# wheels, found through the module's RPATH, as PyTorch and JAX find theirs.
#   PET_NVCC_WRAPPER=<kokkos>/bin/nvcc_wrapper NVCC_APPEND_FLAGS="..." uv build --wheel
[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "pet-kokkos-cuda12"
dynamic = ["version"]
description = "pet-kokkos for NVIDIA GPUs (CUDA 12, compute capability 8.0+): install as pet-kokkos[cuda12]"
requires-python = ">=3.10"
dependencies = ["nvidia-cuda-runtime-cu12>=12.4", "nvidia-cublas-cu12>=12.4"]
license = { file = "../../../LICENSE" }

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.source-dir = "../../.."
build-dir = "build-py/{wheel_tag}"
wheel.packages = ["pet_kokkos_cuda12"]
install.components = ["python"]
wheel.py-api = "cp312"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "../../../CMakeLists.txt"
regex = 'project\(\s*pet_kokkos\s+VERSION\s+(?P<value>[0-9.]+)'

[tool.scikit-build.cmake.define]
PET_BUILD_PYTHON = "ON"
PET_BUILD_TESTS = "OFF"
PET_BUILD_APPS = "OFF"
PET_INSTALL = "OFF"
PET_ARCH_NATIVE = "OFF"
PET_WITH_VESIN = "OFF"
PET_BACKEND = "cuda"
Kokkos_ARCH_AMPERE80 = "ON"
PET_PYTHON_PACKAGE = "pet_kokkos_cuda12"
PET_PYTHON_NVIDIA_WHEELS = "ON"
CMAKE_CXX_COMPILER = { env = "PET_NVCC_WRAPPER", default = "nvcc_wrapper" }

# ---- wheels (cibuildwheel, with uv) ------------------------------------------
# Built in manylinux_2_28 with CUDA 12.8 from NVIDIA's RHEL 8 repository (a GPU
# is not needed to build) and Kokkos's nvcc_wrapper. The CUDA libraries stay
# out of the wheel (NVIDIA's pip wheels provide them); the CI test only
# imports the package, the runners having no GPU.
[tool.cibuildwheel]
build-frontend = "build[uv]"
build = ["cp310-*", "cp311-*", "cp312-*"]
skip = ["*-musllinux_*", "*_i686"]
test-command = "python -c \"import pet_kokkos_cuda12\""

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-all = """
set -e
arch=$(uname -m | sed s/aarch64/sbsa/)
dnf install -y dnf-plugins-core
dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/$arch/cuda-rhel8.repo
dnf install -y cuda-nvcc-12-8 cuda-cudart-devel-12-8 cuda-driver-devel-12-8 cuda-cccl-12-8 libcublas-devel-12-8
curl -fsSL -o /usr/local/bin/nvcc_wrapper https://raw.githubusercontent.com/kokkos/kokkos/5.2.2/bin/nvcc_wrapper
chmod +x /usr/local/bin/nvcc_wrapper
"""
environment = { PATH = "/usr/local/cuda-12.8/bin:$PATH", CUDA_HOME = "/usr/local/cuda-12.8", PET_NVCC_WRAPPER = "/usr/local/bin/nvcc_wrapper", NVCC_APPEND_FLAGS = "-gencode=arch=compute_80,code=sm_80 -gencode=arch=compute_89,code=sm_89 -gencode=arch=compute_90,code=sm_90 -gencode=arch=compute_90,code=compute_90" }
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel} --exclude libcuda.so.1 --exclude libcudart.so.12 --exclude libcublas.so.12 --exclude libcublasLt.so.12"
